<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Timer Task</title>
    <link rel="stylesheet" href="./css/01-timer.css" />
  </head>
  <body>
    <div class="timer-container">
      <input type="text" id="datetime-picker" class="flatpickr-input" />
      <button type="button" data-start class="data-start">Start</button>

      <div class="timer">
        <div class="field">
          <span class="value" data-days> 00 </span>
          <span class="label"> Days </span>
        </div>
        <div class="field">
          <span class="value" data-hours> 00 </span>
          <span class="label"> Hours </span>
        </div>
        <div class="field">
          <span class="value" data-minutes> 00 </span>
          <span class="label"> Minutes </span>
        </div>
        <div class="field">
          <span class="value" data-seconds> 00 </span>
          <span class="label"> Seconds </span>
        </div>
      </div>
    </div>
    <script type="module" src="./js/01-timer.js"></script>
  </body>
</html>
