<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Timer Task</title>
    <script type="module" crossorigin src="/goit-js-hw-10/01-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-BbbuE1sJ.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CZjNVMTf.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/01-timer-CoKqHTu8.css">
  </head>
  <body>
    <div class="timer-container">
      <input type="text" id="datetime-picker" class="flatpickr-input" />
      <button type="button" data-start class="data-start">Start</button>

      <div class="timer">
        <div class="field">
          <span class="value" data-days> 00 </span>
          <span class="label"> Days </span>
        </div>
        <div class="field">
          <span class="value" data-hours> 00 </span>
          <span class="label"> Hours </span>
        </div>
        <div class="field">
          <span class="value" data-minutes> 00 </span>
          <span class="label"> Minutes </span>
        </div>
        <div class="field">
          <span class="value" data-seconds> 00 </span>
          <span class="label"> Seconds </span>
        </div>
      </div>
    </div>
  </body>
</html>
